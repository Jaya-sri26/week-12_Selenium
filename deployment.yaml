apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seleniumapp
  template:
    metadata:
      labels:
        app: seleniumapp
    spec:
      containers:
      - name: seleniumapp
      image: jaya02sri26/selenium:seleniumtestimage
        ports:
        - containerPort: 5001
